name: russian_g2p
description: >
  Russian words, with their stress marked, to the IPA phonemes the Piper
  ru_RU denis voice takes. Written from Russian phonology (palatalisation,
  vowel reduction, devoicing, assimilation); no espeak-ng data. Pure Dart.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.5.0
dev_dependencies:
  test: ^1.25.0
